name: Validate k6 Scripts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Syntax & config validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Validate every script parses cleanly
        run: |
          set -e
          for f in $(find tests -name "*.js"); do
            echo "Inspecting $f"
            k6 inspect "$f" > /dev/null
          done

name: Bug report
description: Report a problem with one of the test scripts
labels: [bug]
body:
  - type: input
    id: script
    attributes:
      label: Script path
      placeholder: tests/http-methods/http-post.js
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / error output
    validations:
      required: true
  - type: input
    id: k6-version
    attributes:
      label: k6 version
      placeholder: k6 version output
